<!DOCTYPE html>
<html lang="en">

  <title>RentLedger — Staff</title>
  <link rel="stylesheet" href="staff.css" />
</head>
<body>
  <h1>RentLedger staff</h1>

    <button id="sign-out">Sign out</button>

  <script src="staff.js"></script>
